<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="PARKING — find, pay for and control city parking in Lviv. Portfolio demo by Uliana Hontar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARKING">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PARKING Lviv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-sized app; on wide screens it sits in a device frame, on phones it fills the screen. Single dark look by design (night city). */
:root{
  --ink:#111111; --ink-2:#181818; --card:#242424; --card-2:#2c2c2e; --line:rgba(255,255,255,.08);
  --text:#f4f5f2; --mute:#9a9a9a; --mute-2:#6e6e6e;
  --or:#ff8e39; --red:#ff3700; --ok:#4cd964; --warn:#ff6b3d;
  --grad:linear-gradient(90deg,var(--or),var(--red));
  --f-disp:'Sora',ui-sans-serif,system-ui,sans-serif; --f-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#070707;color:var(--text);font-family:var(--f-body);font-size:15px;margin:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:16px}
.device{position:relative;width:393px;height:852px;max-height:calc(100% - 0px);border-radius:52px;overflow:hidden;background:var(--ink);box-shadow:0 0 0 10px #1b1b1b,0 0 0 11px #333,0 40px 120px rgba(0,0,0,.6);isolation:isolate}
@media (max-width:520px),(max-height:700px),(display-mode:standalone){
 html,body{background:#45180b;overscroll-behavior:none}
 .device::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46px;z-index:2;pointer-events:none;background:linear-gradient(rgba(69,24,11,0),#45180b)}
 html.sheet-open,html.sheet-open body{background:#232323}
 .stage{padding:0;position:fixed;top:0;left:0;right:0;bottom:0;height:auto}
 .device{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
 .status{height:calc(env(safe-area-inset-top,0px) + 10px);padding:0;overflow:hidden}
 .status>*{display:none!important}
 .tabbar{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
 .with-tabs .scroll{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
 .foot{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 .sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
 .preview,.screen>.card[style*="bottom:104px"]{bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
 .leaflet-top{top:calc(env(safe-area-inset-top,0px) + 132px)}
 .toast{top:calc(env(safe-area-inset-top,0px) + 8px)}
}
.glow-a,.glow-b{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
.glow-a{width:420px;height:340px;right:-150px;top:-170px;background:rgba(235,87,0,.75)}
.glow-b{width:400px;height:380px;left:-40px;bottom:-260px;background:rgba(255,55,0,.55)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1;background:var(--ink);overflow:hidden;will-change:transform}
.screen::before,.screen::after{content:"";position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:-1}
.screen::before{width:420px;height:340px;right:-150px;top:-170px;background:rgba(235,87,0,.75)}
.screen::after{width:400px;height:380px;left:-40px;bottom:-260px;background:rgba(255,55,0,.55)}
.screen>*{position:relative}
.screen.clear{background:transparent;pointer-events:none}.screen.clear::before,.screen.clear::after{display:none}
.screen.clear>*{pointer-events:auto}
.screen.clear>.map,.screen>.preview,.screen>.session-card{position:absolute}
.screen.clear>.session-card{position:relative}
.enter-push{animation:pushIn .38s cubic-bezier(.2,.85,.25,1);z-index:3}
.leave-push{animation:pushOut .38s cubic-bezier(.2,.85,.25,1) forwards;z-index:2}
.enter-pop{animation:popIn .38s cubic-bezier(.2,.85,.25,1);z-index:2}
.leave-pop{animation:popOut .38s cubic-bezier(.2,.85,.25,1) forwards;z-index:3}
.enter-fade{animation:fadeIn .28s ease-out;z-index:3}
.leave-fade{animation:fadeOut .28s ease-out forwards;z-index:2}
.leaving{pointer-events:none!important}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes pushOut{to{transform:translateX(-28%);opacity:.35}}
@keyframes popIn{from{transform:translateX(-28%);opacity:.35}}
@keyframes popOut{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}}
@keyframes fadeOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-weight:600;font-size:15px;position:relative;z-index:5}
.status svg{display:block}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:center;gap:14px;padding:6px 16px 14px}
.hdr h2{margin:0;font-size:17px;font-weight:600}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.h1{font-family:var(--f-disp);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--text);opacity:.6;line-height:1.45;margin:8px 0 0}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:rgba(36,36,36,.75);border:1px solid var(--line);border-radius:20px}
.row{display:flex;align-items:center;gap:12px}
.btn{height:52px;border-radius:26px;width:100%;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--grad);color:#111;box-shadow:0 8px 28px rgba(255,90,0,.28)}
.btn-ghost{border:1px solid rgba(255,255,255,.18);color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.01));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 1px rgba(255,255,255,.12)}
.btn-primary{box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 8px 28px rgba(255,90,0,.28)}
.btn[disabled]{opacity:.35;pointer-events:none}
.foot{padding:12px 16px 26px;display:flex;flex-direction:column;gap:12px;flex:none;position:relative;z-index:3}
.num{font-family:var(--f-disp);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.or{color:var(--or)}
.link{color:var(--or);font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--mute)}
.input{height:52px;border-radius:12px;background:rgba(36,36,36,.7);border:1px solid rgba(255,255,255,.1);padding:0 16px;outline:none;width:100%}
.input:focus{border-color:rgba(255,142,57,.7)}
.chip{height:38px;padding:0 14px;border-radius:19px;background:#303030;border:1px solid rgba(255,255,255,.1);color:#bbb;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
.chip.on,.chip:active{background:rgba(255,107,0,.16);border-color:rgba(255,142,57,.6);color:var(--or)}
.seg{display:flex;background:rgba(17,17,17,.55);border-radius:22px;padding:4px;gap:4px}
.seg button{flex:1;height:34px;border-radius:17px;font-size:13px;font-weight:600;color:var(--mute);transition:background .25s,color .25s}
.seg button.on{background:var(--or);color:#111}
/* tab bar */
.tabbar{position:absolute;left:16px;right:16px;bottom:22px;height:68px;border-radius:34px;padding:4px;display:flex;gap:5px;background:linear-gradient(180deg,rgba(60,60,60,.42),rgba(24,24,24,.55));backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.45);z-index:20}
.tab{height:60px;width:60px;flex:none;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),inset 0 -6px 12px rgba(0,0,0,.25);color:#d0d0d0;transition:width .35s cubic-bezier(.3,.7,.2,1),background .35s,color .35s;overflow:hidden;white-space:nowrap}
.tab.on{width:auto;flex:1;background:var(--grad);color:#111;border-color:rgba(255,200,150,.35);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px rgba(255,90,0,.35)}
.tab span{font-size:15px;font-weight:500;max-width:0;opacity:0;margin-left:0;transition:max-width .35s,opacity .25s,margin .35s}
.tab.on span{max-width:90px;opacity:1;margin-left:8px}
.tabbar{transition:transform .35s cubic-bezier(.2,.85,.25,1),opacity .25s}
.tabbar.hidden{transform:translateY(140%);opacity:0;pointer-events:none}
.tab svg{flex:none}
.with-tabs .scroll{padding-bottom:120px}
/* map */
.map{position:absolute;inset:0;z-index:0;overflow:hidden;touch-action:none;background:#14110f;cursor:grab}
.map svg.base{position:absolute;left:50%;top:50%;width:900px;height:1200px;transform:translate(-50%,-50%)}
.pin{position:absolute;width:30px;height:30px;border-radius:50%;background:#1d1d1d;border:1px solid rgba(255,142,57,.45);display:grid;place-items:center;font-size:12px;font-weight:700;transform:translate(-50%,-50%);transition:transform .2s;z-index:2}
.pin.sel{width:auto;height:auto;background:none;border:0;transform:translate(-50%,-100%)}
.pin.dim{opacity:.25;pointer-events:none}
.me{position:absolute;width:16px;height:16px;border-radius:50%;background:#4aa3ff;border:3px solid #fff;box-shadow:0 0 0 10px rgba(74,163,255,.18);transform:translate(-50%,-50%);z-index:2}
.map-top{position:relative;z-index:4;padding:6px 16px 0}
.map-glow{position:absolute!important;left:0;right:0;top:0;height:320px;pointer-events:none!important;z-index:1;background:radial-gradient(110% 80% at 95% -10%,rgba(235,87,0,.6),rgba(235,87,0,0) 62%),linear-gradient(180deg,rgba(17,17,17,.96) 0%,rgba(17,17,17,.7) 38%,rgba(17,17,17,0) 100%)}
.map-glow.b{top:auto;bottom:0;height:260px;background:radial-gradient(90% 70% at 15% 115%,rgba(255,55,0,.45),rgba(255,55,0,0) 65%)}
.search{display:flex;gap:10px;margin-top:14px}
.search .box{flex:1;min-width:0;height:48px;border-radius:24px;background:linear-gradient(180deg,rgba(70,70,70,.5),rgba(28,28,28,.6));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.14);display:flex;align-items:center;gap:10px;padding:0 16px}
.search input{background:none;border:0;outline:none;flex:1;min-width:0;font-size:14px}
.round{width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,rgba(70,70,70,.55),rgba(28,28,28,.6));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.16);display:grid;place-items:center;flex:none;position:relative}
.dot-badge{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--or)}
.preview{position:absolute;left:16px;right:16px;bottom:104px;z-index:6;padding:16px 18px;animation:up .3s ease-out;background:linear-gradient(180deg,rgba(60,60,60,.55),rgba(24,24,24,.72));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.session-card{margin:12px 16px 0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:6;background:linear-gradient(180deg,rgba(60,60,60,.55),rgba(24,24,24,.72));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.live{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
.live.warn{background:var(--or);box-shadow:0 0 12px var(--or)}
.live.off{background:#777;box-shadow:none}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:#232323;border-radius:30px 30px 0 0;padding:12px 18px 30px;max-height:88%;overflow-y:auto;animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h3{font-family:var(--f-disp);font-size:24px;margin:0;letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;flex:none}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#2c2c2c;border:1px solid transparent;width:100%;text-align:left}
.opt.on{background:rgba(255,107,0,.1);border-color:rgba(255,142,57,.5)}
.radio{width:22px;height:22px;border-radius:50%;border:1.6px solid #5a5a5a;display:grid;place-items:center;flex:none;margin-left:auto}
.on .radio{border-color:var(--or)}
.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--or)}
.toggle{width:46px;height:28px;border-radius:14px;background:#3a3a3a;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#bbb;top:3px;left:3px;transition:left .2s,background .2s}
.toggle.on{background:var(--grad)}
.toggle.on::after{left:21px;background:#111}
input[type=range]{width:100%;accent-color:var(--or)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.16);flex:none;color:#e6e6e6;line-height:0}
.step-btn svg{display:block}
.step-btn.plus{background:rgba(255,107,0,.12);border-color:rgba(255,107,0,.3);color:var(--or)}
.step-btn:disabled{opacity:.35}
/* pay sheet */
.pay{background:#1c1c1e;border-radius:34px 34px 0 0}
.side-cue{position:absolute;right:0;top:255px;z-index:45;display:flex;align-items:center;gap:12px;animation:fade .3s}
.side-cue b{font-size:13px;text-align:right;line-height:1.25}
.side-cue i{width:4px;height:90px;border-radius:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.8);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.grp{background:#2c2c2e;border-radius:14px}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--or);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* toast */
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-140%);z-index:60;background:#262626;border:1px solid rgba(76,217,100,.45);border-radius:22px;padding:11px 18px 11px 12px;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .tick{width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.toast.warn{border-color:rgba(255,142,57,.6)}.toast.warn .tick{background:var(--or)}
.list{display:flex;flex-direction:column;gap:12px}
.li{padding:16px 18px;display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px}
.b-unpaid{background:rgba(255,55,0,.16);color:var(--warn)}
.b-paid{background:rgba(52,199,89,.16);color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--mute)}
.kv span:last-child{text-align:right;font-weight:500}
.menu-row{display:flex;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.menu-row svg.ic{color:#8a8a8a}
.otp{display:flex;gap:10px}
.otp input{width:100%;height:60px;border-radius:12px;background:rgba(36,36,36,.7);border:1px solid rgba(255,255,255,.1);text-align:center;font-family:var(--f-disp);font-size:24px;font-weight:600;outline:none}
.otp input:focus{border-color:var(--or)}
.timer-big{font-size:68px;text-align:center;color:var(--or);text-shadow:0 0 40px rgba(255,120,0,.35);line-height:1}
.timer-big.off{color:rgba(244,245,242,.35);text-shadow:none}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.input.err{border-color:var(--warn)}
.ferr{font-size:12px;color:var(--warn);min-height:0}
.ferr:empty{display:none}
.vrow{display:flex;gap:8px;align-items:stretch}
.vrow .opt{flex:1;min-width:0}
.del{width:52px;border-radius:18px;background:#2c2c2c;display:grid;place-items:center;color:#9a9a9a;flex:none}
.del:hover{color:var(--warn)}
.btn-danger{background:#ff3b30;color:#fff}
.sheet.static,.scrim.static{animation:none}
.sheet.closing{animation:sheetOut .24s ease-in forwards}
.scrim.closing{animation:fadeOut .24s forwards}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes cardOut{to{transform:translateY(-140%);opacity:0}}
@keyframes topIn{from{transform:translateY(-120%);opacity:0}}
.session-card.leaving{animation:cardOut .38s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.map-top.enter{animation:topIn .42s cubic-bezier(.2,.8,.2,1)}
/* leaflet (essential subset of leaflet.css) */
.lmap{position:absolute;inset:0;z-index:0;background:#0d0d0d;display:none}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-body);outline:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-animated{will-change:transform}.leaflet-fade-anim .leaflet-tile{will-change:opacity}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}.leaflet-tile-container{pointer-events:none}
.leaflet-container canvas.leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon{display:block}.leaflet-interactive{cursor:pointer}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-bottom{bottom:96px}.leaflet-right{right:8px}.leaflet-top{top:150px}
.leaflet-control{pointer-events:auto}

function buildMap(){
 let seed=11; const r=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
 const W=900,H=1200; let defs='', g='';
 const parks=[[300,860,95,60,-10],[640,360,70,48,20],[170,310,62,44,0],[560,980,80,50,15]];
 g+=parks.map(([x,y,rx,ry,a])=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${a} ${x} ${y})" fill="#1b1d16"/>`).join('');
 const D=[{x:450,y:600,r:175,a:12,s:30},{x:240,y:460,r:230,a:-8,s:42},{x:660,y:520,r:230,a:27,s:40},{x:430,y:910,r:260,a:4,s:46},{x:660,y:870,r:210,a:-18,s:42},{x:210,y:860,r:220,a:32,s:46},{x:450,y:250,r:250,a:-14,s:44},{x:760,y:210,r:200,a:8,s:48},{x:120,y:150,r:200,a:20,s:48},{x:800,y:1080,r:200,a:-5,s:48},{x:110,y:1100,r:200,a:12,s:48}];
 D.forEach((d,i)=>{ defs+=`<clipPath id="cl${i}"><circle cx="${d.x}" cy="${d.y}" r="${d.r}"/></clipPath>`; let l='';
  for(let k=-d.r;k<=d.r;k+=d.s){ const j=(r()-.5)*8; if(r()>.12) l+=`<path d="M${d.x-d.r} ${d.y+k+j} L${d.x+d.r} ${d.y+k+j*.4}"/>`; if(r()>.18) l+=`<path d="M${d.x+k+j} ${d.y-d.r} L${d.x+k-j*.3} ${d.y+d.r}"/>`; }
  g+=`<g clip-path="url(#cl${i})"><g transform="rotate(${d.a} ${d.x} ${d.y})" stroke="#4f3322" stroke-width="2.2" fill="none">${l}</g></g>`; });
 const cx=450,cy=600; let m='';
 m+=`<ellipse cx="${cx}" cy="${cy}" rx="178" ry="150" stroke="#c4834d" stroke-width="5" fill="none"/>`;
 m+=`<path d="M${cx-360} ${cy-300} Q ${cx-60} ${cy-400} ${cx+300} ${cy-260} Q ${cx+430} ${cy-40} ${cx+330} ${cy+240} Q ${cx+80} ${cy+390} ${cx-240} ${cy+300} Q ${cx-430} ${cy+30} ${cx-360} ${cy-300}" stroke="#b9773f" stroke-width="5" fill="none"/>`;

 m+=`<path d="M0 1000 Q 300 940 520 1010 T 900 960" stroke="#d6965c" stroke-width="7" fill="none"/>`;
 m+=`<text x="${cx+30}" y="${cy-36}" font-family="Sora,sans-serif" font-size="44" font-weight="600" fill="#f4f5f2" opacity=".45">Lviv</text>`;
 MAP_SVG=`<svg class="base" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>${defs}</defs><rect width="${W}" height="${H}" fill="#14110f"/>${g}${m}</svg>`;
}

 return `<div class="map" id="map"><div id="mapLayer" style="position:absolute;inset:0;transform:translate(${UI.pan?.x||0}px,${UI.pan?.y||0}px)">${MAP_SVG}${pins}<div class="me" style="left:calc(50% + ${ME.x-450+MAPOFF.x}px);top:calc(50% + ${ME.y-600+MAPOFF.y}px)"></div></div></div>`;
}
function resultsHTML(){ const r=filtered().slice().sort((a,b)=>a.dist-b.dist); return `<div class="card" style="margin-top:10px;max-height:330px;overflow-y:auto;background:rgba(30,30,30,.97)">${r.length?`<div class="label" style="padding:14px 18px 6px">${r.length} result${r.length>1?'s':''}</div>`+r.map(p=>`<button class="row" style="width:100%;text-align:left;padding:12px 18px;border-top:1px solid var(--line)" data-a="pickResult" data-v="${p.id}">${I.pinS}<div style="flex:1;min-width:0"><div style="font-weight:600">${p.id} · ${p.name}</div><div class="hint">${p.dist<1000?p.dist+' m':(p.dist/1000).toFixed(1)+' km'} · ${p.spots} spots · ${p.h24?'24/7':p.hours}</div></div><span class="num or" style="font-size:16px">${money(p.rate)}<span class="hint">/hr</span></span></button>`).join(''):`<div class="empty" style="padding:22px">Nothing found for “${UI.search}”. Try a street or a code like B1001.</div>`}</div>`; }
const FOPTS={distance:['300','500','1000','2000','2000+'],type:['open','covered','underground']};
const distBand=d=>d<300?'300':d<=500?'500':d<=1000?'1000':d<=2000?'2000':'2000+';
const allOn=k=>FOPTS[k].every(v=>S.filters[k].includes(v));
function filtered(){ const f=S.filters, q=UI.search.trim().toLowerCase();
 return PARKINGS.filter(p=>p.rate<=f.maxPrice && (!f.distance.length||f.distance.includes(distBand(p.dist))) && (!f.type.length||f.type.includes(p.type)) && (!f.ev||p.ev)&&(!f.access||p.access)&&(!f.h24||p.h24) && (!q||(p.name+' '+p.id).toLowerCase().includes(q))); }
const filtersOn=()=>{const f=S.filters; return f.maxPrice<100||(f.distance.length&&!allOn('distance'))||(f.type.length&&!allOn('type'))||f.ev||f.access||f.h24;};

}

/* ---------- session logic ---------- */
function remaining(){ return S.session? S.session.endsAt-vnow() : 0; }
function sessionState(){ if(!S.session) return 'none'; if(S.session.ended) return 'ended'; const r=remaining(); if(r<=0) return 'ended'; if(r<=15*60e3) return 'warn'; return 'active'; }
function startSession(){
 const p=P(UI.selected), mins=setupMins(), total=setupPrice();
 const now=vnow();
 S.session={pid:p.id,startAt:now,endsAt:now+mins*60e3,mins,total,mode:S.setup.mode,plate:veh().plate,model:`${veh().model} · ${veh().color}`,card:cardLabel(card()),warned:false,ended:false,id:'PK-'+String(Math.floor(now/1000)).slice(-4)};
 save(); notify('Parking started',`${p.id} · ${p.name} · ${durLabel(mins)} · ${money(total)}`);

function clearEndedOnMap(){

  S.session=null; UI.selected=null; save(); UI.mapIntro=true; render();
  if(LMAP.map&&LMAP.mode==='leaflet'){ LMAP.lastSel=null; LMAP.map.flyTo([ME.lat,ME.lng+0.002],15,{duration:.7}); } };
 const c=document.querySelector('#screens .session-card');
 if(c&&UI.route==='map'){ c.classList.add('leaving'); setTimeout(fin,360); } else fin(); }

function paySheetHTML(){ const pay=UI.pay;

 <button class="dbl" id="dbl" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px" aria-label="Confirm payment (double-click or double-tap)">${I.phone}<span class="hint" style="font-size:13px">Confirm with Side Button</span><span class="hint" style="font-size:11px;opacity:.7">Double-click here or the bar on the right</span></button>`;

function openPay(kind,amount,desc){ UI.pay={kind,amount,desc,stage:'confirm'}; UI.sheet='pay'; render(); }
function confirmPay(){ if(!UI.pay||UI.pay.stage!=='confirm') return; UI.pay.stage='processing'; render();
 setTimeout(()=>{ UI.pay.stage='done'; render(); setTimeout(()=>{ const k=UI.pay.kind; closeSheet(()=>finishPay(k)); },650); },900); }
function finishPay(kind){
 if(kind==='start'){ startSession(); UI.stack=[]; UI.route='active'; render('fade'); }
 else if(kind==='extend'){ const s=S.session, daily=s.mode==='daily', p=P(s.pid), n=UI.ext; const add=n*(daily?1440:60); s.endsAt+=add*60e3; s.mins+=add; s.total+=daily?p.day*n:p.rate*n; s.warned=false; save(); notify('Parking extended',`${s.pid} · +${hl(n,daily?'day':'hour')} · ${money(daily?p.day*n:p.rate*n)}`); UI.route='active'; render(); toast('Parking successfully extended'); }
 else if(kind==='fine'){ const f=S.fines.find(x=>x.id===UI.fineId); f.paid=true; f.paidAt=vnow(); save(); notify('Fine paid',`#${f.id} · ${money(f.amount)}`); render(); toast('Fine paid'); }
}

 const tpl=document.createElement('template'); tpl.innerHTML=(SCREENS[route]||SCREENS.map)().trim(); const el=tpl.content.firstElementChild;

  const keep=document.activeElement&&old.contains(document.activeElement)?document.activeElement.id:null;

function bindMapDrag(){ const m=$('#map'); if(!m) return; let sx,sy,ox,oy,down=false,moved=false;
 m.onpointerdown=e=>{ if(e.target.closest('.pin')) return; down=true; moved=false; sx=e.clientX; sy=e.clientY; ox=UI.pan?.x||0; oy=UI.pan?.y||0; m.setPointerCapture(e.pointerId); };
 m.onpointermove=e=>{ if(!down) return; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; UI.pan={x:Math.max(-250,Math.min(250,ox+dx)),y:Math.max(-300,Math.min(300,oy+dy))}; $('#mapLayer').style.transform=`translate(${UI.pan.x}px,${UI.pan.y}px)`; };
 m.onpointerup=()=>{ down=false; if(!moved&&UI.selected&&!S.session){ UI.selected=null; render(); } };
}

/* ---------- live clock ---------- */
let lastState=null;
setInterval(()=>{
 if(!S.session||S.session.ended){ lastState=sessionState(); return; }
 const st=sessionState();
 if(st==='ended'){ endSession(); notify('Parking ended',`${S.session.pid} · ${durLabel(S.session.mins)} · ${money(S.session.total)}`); render(); toast('Parking ended','warn'); lastState='ended'; return; }
 if(st==='warn'&&!S.session.warned){ S.session.warned=true; save(); if(S.settings.warn15){ notify('15 minutes left',`${S.session.pid} · Extend now to keep your spot.`); toast('15 minutes left','warn'); } if(UI.route==='active'||UI.route==='map') render(); }
 if(lastState!==st && (UI.route==='active'||UI.route==='map')) render();
 lastState=st;
 document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=fmtRemain(remaining()));
},250);

/* ---------- boot ---------- */
initLeaflet();
render();
setTimeout(()=>{ UI.route=S.authed? (S.onboarded?(S.session&&!S.session.ended?'active':'map'):'location') : 'welcome'; render('fade'); },1700);
</script>

</body>
